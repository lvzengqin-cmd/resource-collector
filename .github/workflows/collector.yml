name: Daily Resource Collection

on:
  # 每天北京时间 9:00 (UTC 1:00) 自动执行
  schedule:
    - cron: '0 1 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run collector
        run: python collector.py
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: collect-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
